services:
  surrealdb:
    image: surrealdb/surrealdb:v2.2.1
    ports:
      - "8000:8000"
    command: start --user root --pass root --bind 0.0.0.0:8000 file:/data/surreal.db
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./docker/data:/data
    restart: unless-stopped

  geoserver:
    image: kartoza/geoserver:2.28.0
    ports:
      - "8080:8080"
    environment:
      - GEOSERVER_ADMIN_USER=admin
      - GEOSERVER_ADMIN_PASSWORD=geoserver
    volumes:
      # Plugin JAR
      - ./target/gt-surrealdb-1.0.0-SNAPSHOT.jar:/usr/local/tomcat/webapps/geoserver/WEB-INF/lib/gt-surrealdb.jar
      # SurrealDB SDK (includes JNI native libs for all platforms)
      - ./target/lib/surrealdb-1.0.0-beta.1.jar:/usr/local/tomcat/webapps/geoserver/WEB-INF/lib/surrealdb.jar
      # Gson (JSON parsing) - override both the new and bundled old version
      - ./target/lib/gson-2.11.0.jar:/usr/local/tomcat/webapps/geoserver/WEB-INF/lib/gson.jar
      - ./target/lib/gson-2.11.0.jar:/usr/local/tomcat/webapps/geoserver/WEB-INF/lib/gson-2.3.1.jar
    depends_on:
      surrealdb:
        condition: service_healthy
    restart: unless-stopped
